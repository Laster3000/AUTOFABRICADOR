name: R91B — aventura HD 16:9, nav A* y 242 pruebas Godot
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-adventure:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Fuentes públicas verificables
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar solo la dependencia artística
        run: python -m pip install --disable-pip-version-check -r examples/adventure-godot-r91b/requirements-r91-art.txt
      - name: Reconstruir el arte original R90C y las mejoras R91B
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $game = Join-Path $env:GITHUB_WORKSPACE 'examples/adventure-godot-r91b'
          $source = Join-Path $game 'art/base_r90'
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          $env:R90_ART_OUT=$source
          python examples/adventure-godot-r90c/art/r90_illustrate.py
          if ($LASTEXITCODE -ne 0) { throw 'Generación original R90C fallida' }
          $env:R91_SOURCE_ROOT=$source
          $env:R91_ART_OUT=Join-Path $env:RUNNER_TEMP 'r91b-generated-art'
          python (Join-Path $game 'art/r91_hd_art.py')
          if ($LASTEXITCODE -ne 0) { throw 'Generación HD R91B fallida' }
          New-Item -ItemType Directory -Force -Path (Join-Path $game 'assets'),(Join-Path $game 'source') | Out-Null
          Copy-Item (Join-Path $env:R91_ART_OUT 'assets/*.png') (Join-Path $game 'assets')
          Copy-Item (Join-Path $env:R91_ART_OUT 'source/*.ora') (Join-Path $game 'source')
          python (Join-Path $game 'ci_verify_art.py')
          if ($LASTEXITCODE -ne 0) { throw '22 PNG/ORA o 3 nav contratos no reproducibles' }
      - name: Descargar Godot 4.6.3 oficial anclado SHA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'godot-4.6.3-stable.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $zip
          $actual=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90') {
            throw 'Godot 4.6.3 SHA-256 inesperado'
          }
          $dir=Join-Path $env:RUNNER_TEMP 'godot-r91b'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          "GODOT_R91B=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Importar el proyecto Godot HD
        shell: pwsh
        run: |
          $exe=Join-Path $env:GODOT_R91B 'Godot_v4.6.3-stable_win64_console.exe'
          $game=Join-Path $env:GITHUB_WORKSPACE 'examples/adventure-godot-r91b'
          & $exe --headless --editor --path $game --quit
          if ($LASTEXITCODE -ne 0) { throw 'Importación Godot HD fallida' }
      - name: 35 comprobaciones originales jugables
        shell: pwsh
        run: |
          $exe=Join-Path $env:GODOT_R91B 'Godot_v4.6.3-stable_win64_console.exe'
          $game=Join-Path $env:GITHUB_WORKSPACE 'examples/adventure-godot-r91b'
          & $exe --headless --path $game --script 'res://qa/owner_test_r91.gd'
          if ($LASTEXITCODE -ne 0) { throw 'Pruebas E2E R91B fallidas' }
          $r=Get-Content (Join-Path $game 'qa/R91-GODOT-OWNER-READBACK.json') -Raw | ConvertFrom-Json
          if ($r.status -ne 'PASS_SCOPED_THREE_SCENE_STANDALONE_GODOT_OWNER' -or $r.checks.Count -ne 35 -or
              @($r.checks | Where-Object { -not $_.pass }).Count -ne 0) { throw 'Fallo contrato 35 checks' }
      - name: 207 pruebas de navegación y 1709 pasos simulados
        shell: pwsh
        run: |
          $exe=Join-Path $env:GODOT_R91B 'Godot_v4.6.3-stable_win64_console.exe'
          $game=Join-Path $env:GITHUB_WORKSPACE 'examples/adventure-godot-r91b'
          & $exe --headless --path $game --script 'res://qa/nav_owner_r91.gd'
          if ($LASTEXITCODE -ne 0) { throw 'R91B navegación fuera de bounds' }
          $r=Get-Content (Join-Path $game 'qa/R91-NAV-OWNER-READBACK.json') -Raw | ConvertFrom-Json
          if ($r.status -ne 'PASS_R91_NAV_WALKBOX_ANTI_CLIP' -or $r.checks.Count -ne 207 -or
              @($r.checks | Where-Object { -not $_.pass }).Count -ne 0) { throw 'Fallo contrato 207 checks' }
      - name: Archivar arte y QA como evidencias
        uses: actions/upload-artifact@v4
        with:
          name: AUTOFABRICADOR-R91B-HD-NAV-ART-ORIGINAL-EVIDENCE
          path: |
            examples/adventure-godot-r91b/assets/*.png
            examples/adventure-godot-r91b/source/*.ora
            examples/adventure-godot-r91b/qa/R91-GODOT-OWNER-READBACK.json
            examples/adventure-godot-r91b/qa/R91-NAV-OWNER-READBACK.json
          retention-days: 30
          if-no-files-found: error
